<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">

  <title>Mi programacion academica</title>

</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <!--Sección 2: Próximo y Eventos-->
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-8">
        <div class="titulo-seccion color-proximo"><h2>Próximo</h2></div>
      </div>
      <div class="col-sm-4">
        <div class="titulo-seccion color-eventos"><h2>Eventos</h2></div>
        <ul id="listaEventos" class="list-group" style="margin-top: 10px;">
          <li class="list-group-item itemEvento">
            <textarea rows="1" class="nuevoEvento" oninput="this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'" placeholder="Ingrese un evento..."></textarea>
            <button class="btn btn-outline-secondary btn-sm btnEliminar">X</button>
          </li>
        </ul>
        <button class="btn btn-outline-primary agregarEvento">+</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
